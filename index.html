<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Пошли погуляем</title>
<link href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap&subset=cyrillic" rel="stylesheet">
<style>
*{margin:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;background:#070a24}
.scene{position:fixed;inset:0;overflow:hidden;background:linear-gradient(#050820 0%,#121a52 55%,#3a3a86 85%,#6a4a8a 100%)}
.star{position:absolute;width:3px;height:3px;border-radius:50%;background:#fff;animation:tw 3s ease-in-out infinite}
@keyframes tw{50%{opacity:.15}}
.moon{position:absolute;top:9vh;right:8vw;width:clamp(60px,9vw,120px);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fffbe6,#f6e7a8 70%);box-shadow:0 0 40px 12px rgba(255,240,170,.35)}
.moon::before{content:"";position:absolute;left:55%;top:25%;width:22%;height:22%;border-radius:50%;background:rgba(200,180,110,.35);box-shadow:-30px 40px 0 -2px rgba(200,180,110,.3)}
h1{position:absolute;top:4vh;left:0;right:0;text-align:center;z-index:10;font-family:'Pacifico','Comic Sans MS',cursive;font-weight:400;font-size:clamp(34px,7vw,88px);color:#fff4c2;text-shadow:0 0 8px #ffd36b,0 0 24px #ff9f43,0 0 48px #ff7a2f;animation:glow 2.5s ease-in-out infinite alternate}
@keyframes glow{from{opacity:.85}to{opacity:1}}
.layer{position:absolute;left:0;display:flex;animation:scroll linear infinite}
.layer svg{display:block;flex:none}
@keyframes scroll{to{transform:translateX(-50%)}}
#far{bottom:24vh;z-index:3}#mid{bottom:24vh;z-index:4}#near{bottom:24vh;z-index:5}
#lamps{bottom:17vh;z-index:7}
.ground{position:absolute;left:0;right:0;bottom:0;height:24vh;z-index:6}
.sidewalk{height:14vh;border-top:4px solid #7d82c4;background:linear-gradient(90deg,rgba(0,0,0,.28) 0 3px,transparent 3px) 0 0/160px 100% repeat-x,#474c88;animation:slideS var(--tSide,.6s) linear infinite}
.road{height:10vh;border-top:5px solid #2a2e5c;background:linear-gradient(90deg,#e8c95a 0 100px,transparent 100px 200px) 0 50%/200px 8px repeat-x,#1b1e3a;animation:slideR var(--tRoad,.75s) linear infinite}
@keyframes slideS{to{background-position:-160px 0,0 0}}
@keyframes slideR{to{background-position:-200px 50%,0 0}}
.dogs{position:absolute;left:0;right:0;bottom:11vh;z-index:8;display:flex;justify-content:center;align-items:flex-end;gap:2vw}
.dog{width:min(44vw,400px);height:auto;overflow:visible}
.bob{animation:bob .4s ease-in-out infinite;animation-delay:var(--ph)}
@keyframes bob{50%{transform:translateY(-4px)}}
.leg{animation:swing .8s ease-in-out infinite;animation-delay:var(--ph)}
.leg.b{animation-delay:calc(var(--ph) - .4s)}
@keyframes swing{0%,100%{transform:rotate(-30deg)}50%{transform:rotate(30deg)}}
.head{transform-origin:240px 100px;animation:nod .4s ease-in-out infinite alternate;animation-delay:var(--ph)}
@keyframes nod{from{transform:rotate(-3deg)}to{transform:rotate(3deg)}}
.tail{transform-origin:52px 78px;animation:wag .25s ease-in-out infinite alternate}
@keyframes wag{from{transform:rotate(-14deg)}to{transform:rotate(14deg)}}
.ear{transform-box:fill-box;transform-origin:50% 0;animation:flap .4s ease-in-out infinite alternate}
@keyframes flap{from{transform:rotate(-8deg)}to{transform:rotate(8deg)}}
</style>
</head>
<body>
<div class="scene">
  <div class="moon"></div>
  <h1>🐾 Пошли погуляем 🐾</h1>
  <div class="layer" id="far"></div>
  <div class="layer" id="mid"></div>
  <div class="layer" id="near"></div>
  <div class="ground"><div class="sidewalk"></div><div class="road"></div></div>
  <div class="layer" id="lamps"></div>
  <div class="dogs" id="dogs"></div>
</div>

function dog(o){
  const leg=(x,c,cls)=>`<g transform="translate(${x},105)"><g class="leg ${cls}"><rect x="-9" y="-4" width="18" height="70" rx="9" fill="${c}"/><ellipse cx="3" cy="66" rx="14" ry="8" fill="${c}"/></g></g>`;
  const bow=o.bow?`<g transform="translate(228,20)"><path d="M0 0L-19 -11L-19 11ZM0 0L19 -11L19 11Z" fill="#ff6fa5"/><circle r="5" fill="#ff3d86"/></g>`:'';
  return `<svg class="dog" viewBox="0 0 340 192" style="--ph:${o.ph}s">
  <defs><clipPath id="c-${o.id}"><circle cx="265" cy="58" r="44"/></clipPath></defs>
  <ellipse cx="170" cy="185" rx="140" ry="7" fill="#000" opacity=".3"/>
  <g class="bob">
    <path class="tail" d="M52 80Q18 70 12 34" stroke="${o.body}" stroke-width="13" stroke-linecap="round" fill="none"/>
    ${leg(108,o.shade,'b')}${leg(180,o.shade,'a')}
    <rect x="40" y="56" width="200" height="60" rx="30" fill="${o.body}"/>
    <rect x="222" y="82" width="78" height="44" rx="22" fill="${o.body}"/>
    ${leg(80,o.body,'a')}${leg(212,o.body,'b')}
    <g class="head">
      <g transform="rotate(12 214 80)"><ellipse class="ear" cx="214" cy="80" rx="17" ry="36" fill="${o.ear}"/></g>
      <g transform="rotate(-12 316 80)"><ellipse class="ear" cx="316" cy="80" rx="17" ry="36" fill="${o.ear}"/></g>
      <circle cx="265" cy="58" r="49" fill="${o.body}"/>
      <image href="${o.photo}" x="221" y="14" width="88" height="88" clip-path="url(#c-${o.id})" preserveAspectRatio="xMidYMid slice"/>
      <rect x="232" y="100" width="66" height="12" rx="6" fill="${o.collar}"/>
      <circle cx="265" cy="119" r="6" fill="#ffd34d"/>
      ${bow}
    </g>
  </g></svg>`;
}
document.getElementById('dogs').innerHTML = DOGS.map(dog).join('');

// звёзды
const scene=document.querySelector('.scene');
for(let i=0;i<80;i++){
  const s=document.createElement('div');s.className='star';
  s.style.left=Math.random()*100+'%';s.style.top=Math.random()*50+'%';
  s.style.animationDelay=(Math.random()*3)+'s';s.style.transform=`scale(${.5+Math.random()})`;
  scene.prepend(s);
}

function rng(seed){return()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

function tile(W,H,fill,seed,lit,op,minW,maxW){
  const r=rng(seed);let x=0,s='';
  while(x<W){
    let w=minW+r()*(maxW-minW);
    if(W-x<minW*1.4) w=W-x;
    w=Math.min(w,W-x);
    const h=H*(.4+r()*.6),y=H-h;
    s+=`<rect x="${x}" y="${y}" width="${w+1}" height="${h}" fill="${fill}"/>`;
    if(r()<.3) s+=`<rect x="${x+w/2-1}" y="${y-18}" width="2" height="18" fill="${fill}"/>`;
    for(let wy=y+12;wy<H-14;wy+=22)
      for(let wx=x+8;wx<x+w-14;wx+=18)
        if(r()<lit) s+=`<rect x="${wx}" y="${wy}" width="9" height="12" rx="1" fill="${r()<.8?'#ffd36b':'#8fd3ff'}" opacity="${op}"/>`;
    x+=w;
  }
  return s;
}

function fill(el,inner,W,H,dur){
  const svg=`<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">${inner}</svg>`;
  el.style.width=(2*W)+'px';
  el.innerHTML=svg+svg;
  el.style.animationDuration=dur+'s';
}

function build(){
  const vw=innerWidth,vh=innerHeight,W=Math.max(vw,800);
  const dogW=Math.min(vw*.44,400),V=dogW*.7;           // скорость «земли», px/с
  const root=document.documentElement.style;
  root.setProperty('--tSide',(160/V)+'s');
  root.setProperty('--tRoad',(200/V)+'s');

  const layers=[
    {id:'far', h:.40,fill:'#141b4f',seed:3, lit:.12,op:.5, min:50,max:110,k:.06},
    {id:'mid', h:.32,fill:'#1d2565',seed:7, lit:.28,op:.75,min:50,max:100,k:.15},
    {id:'near',h:.24,fill:'#2a317f',seed:11,lit:.40,op:.95,min:60,max:120,k:.35}
  ];
  layers.forEach(l=>{
    const H=Math.round(vh*l.h);
    fill(document.getElementById(l.id),tile(W,H,l.fill,l.seed,l.lit,l.op,l.min,l.max),W,H,W/(V*l.k));
  });

  // фонари едут со скоростью тротуара
  const S=Math.max(380,vw*.5),LW=Math.round(2*S),LH=Math.round(vh*.5),top=LH*.4;
  const lamp=x=>`<circle cx="${x+28}" cy="${top+8}" r="${LH*.38}" fill="url(#lg)"/>
    <rect x="${x-3}" y="${top}" width="6" height="${LH-top}" fill="#10122b"/>
    <rect x="${x-3}" y="${top-3}" width="34" height="5" rx="2" fill="#10122b"/>
    <ellipse cx="${x+28}" cy="${top+6}" rx="12" ry="5" fill="#fff3b0"/>`;
  const defs=`<defs><radialGradient id="lg"><stop offset="0" stop-color="#ffe9a0" stop-opacity=".55"/><stop offset="1" stop-color="#ffe9a0" stop-opacity="0"/></radialGradient></defs>`;
  fill(document.getElementById('lamps'),defs+lamp(S*.5)+lamp(S*1.5),LW,LH,LW/V);
}
build();
addEventListener('resize',build);
</script>
</body>
</html>
